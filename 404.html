<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Moved | Overture Maps Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --omf-navy:  #2C2E7F;
      --omf-teal:  #0EC1BD;
      --omf-blue:  #4051CC;
      --omf-cyan:  #4EDAD8;
      --omf-dark:  #001A39;
      --omf-white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: var(--omf-dark);
      color: var(--omf-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--omf-cyan);
      margin-bottom: 1.25rem;
    }

    p {
      font-weight: 300;
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 480px;
      color: var(--omf-white);
      margin-bottom: 0.75rem;
    }

    a {
      color: var(--omf-teal);
      text-decoration: none;
      font-weight: 400;
    }

    a:hover { text-decoration: underline; color: var(--omf-cyan); }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--omf-teal);
      margin: 0 auto 1.5rem;
    }

    footer {
      position: fixed;
      bottom: 1.25rem;
      font-size: 0.7rem;
      font-weight: 300;
      color: var(--omf-cyan);
      opacity: 0.6;
    }

    footer a { color: inherit; }
  </style>
</head>
<body>

  <h1>This resource has moved</h1>
  <div class="divider"></div>

  <p>
    The file you requested is no longer published here. Release discovery is
    now handled by the
    <a href="https://stac.overturemaps.org/catalog.json">Overture STAC catalog</a>
    (SpatioTemporal Asset Catalog).
  </p>
  <p>
    See the <a href="https://github.com/OvertureMaps/data#release-discovery">data repo README</a>
    for details. Redirecting in 5 seconds&hellip;
  </p>

  <footer><a href="https://overturemaps.org">overturemaps.org</a></footer>

</body>
</html>
